openapi: 3.0.3
info:
  title: Absensi Face Recognition API
  description: |
    Backend REST API for the employee attendance system.
    Milestone 2 adds face enrollment/verification (on-device embeddings:
    the mobile app extracts embeddings, the server stores and compares them).
  version: 1.1.0
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      summary: Register an operator account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      summary: Login and receive a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/employees:
    get:
      summary: List employees
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/attendance/check-in:
    post:
      summary: Record a check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Employee already checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/attendance/check-out:
    post:
      summary: Record a check-out against the open check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '201':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open check-in found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/attendance:
    get:
      summary: Attendance history for an employee
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Defaults to 30 days ago
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Defaults to now
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Attendance logs, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/face/enroll:
    post:
      summary: Enroll (or re-enroll) an employee's face template
      description: |
        Stores the L2-normalized average of the quality-passing embeddings as
        the employee's face template, replacing any previous template.
        Embeddings are extracted on-device; supported dimensions: 128, 192, 512.
        Frames with quality_score below 0.5 are discarded; at least one frame
        must pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceEnrollRequest'
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/face/verify:
    post:
      summary: Verify a face embedding 1:1 against the claimed employee
      description: |
        Compares the probe embedding against the claimed employee's stored
        template using cosine distance. match is true when
        distance < threshold (default 0.50, tunable via FACE_MATCH_THRESHOLD).
        liveness_score is accepted for the Milestone 3 anti-spoofing pipeline
        and currently only validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    ActiveOnly:
      name: active_only
      in: query
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
          example: email is not valid

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Admin
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          minLength: 8
          example: secret123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires
          example: 900

    TokenPairResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'

    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_no:
          type: string
          example: EMP001
        name:
          type: string
          example: Budi Santoso
        department:
          type: string
          example: IT
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      required: [employee_no, name]
      properties:
        employee_no:
          type: string
          example: EMP001
        name:
          type: string
          example: Budi Santoso
        department:
          type: string
          example: IT

    EmployeeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    AttendanceLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        type:
          type: string
          enum: [check_in, check_out]
        method:
          type: string
          enum: [face, manual]
          description: face is reserved for Milestone 2
        verified:
          type: boolean
        liveness_score:
          type: number
          nullable: true
          description: Reserved for Milestone 2 anti-spoofing
        recorded_at:
          type: string
          format: date-time

    CheckInRequest:
      type: object
      required: [employee_no]
      properties:
        employee_no:
          type: string
          example: EMP001
        method:
          type: string
          enum: [face, manual]
          default: manual
        device_id:
          type: string
          example: pixel-8-abc123
        platform:
          type: string
          example: android

    CheckOutRequest:
      type: object
      required: [employee_no]
      properties:
        employee_no:
          type: string
          example: EMP001
        device_id:
          type: string
        platform:
          type: string

    AttendanceLogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AttendanceLog'

    AttendanceLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceLog'

    FaceEnrollRequest:
      type: object
      required: [employee_id, embeddings, quality_scores]
      properties:
        employee_id:
          type: integer
          format: int64
          example: 1
        embeddings:
          type: array
          description: 1-5 face embeddings extracted on-device (dimensions 128, 192 or 512)
          minItems: 1
          maxItems: 5
          items:
            type: array
            items:
              type: number
              format: float
        quality_scores:
          type: array
          description: Per-frame quality 0-1, aligned with embeddings; frames below 0.5 are discarded
          items:
            type: number
            minimum: 0
            maximum: 1

    FaceVerifyRequest:
      type: object
      required: [employee_id, embedding]
      properties:
        employee_id:
          type: integer
          format: int64
          description: Claimed identity — verification is always 1:1, never 1:N
          example: 1
        embedding:
          type: array
          description: Probe embedding extracted on-device
          items:
            type: number
            format: float
        liveness_score:
          type: number
          minimum: 0
          maximum: 1
          description: Optional; validated now, enforced by the Milestone 3 anti-spoofing pipeline

    FaceEnrollment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        dimension:
          type: integer
          example: 128
        quality_score:
          type: number
          example: 0.85
        enrolled_at:
          type: string
          format: date-time

    FaceEnrollmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FaceEnrollment'

    FaceVerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            match:
              type: boolean
              example: true
            distance:
              type: number
              description: Cosine distance between probe and template
              example: 0.12
            threshold:
              type: number
              description: Acceptance threshold (match when distance < threshold)
              example: 0.5
