openapi: 3.0.3
info:
  title: Absensi Face Recognition API
  description: |
    Backend REST API for the employee attendance system.
    Milestone 2 adds face enrollment/verification (on-device embeddings:
    the mobile app extracts embeddings, the server stores and compares them).
  version: 1.2.0
servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      summary: Register an operator account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      summary: Login and receive a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/employees:
    get:
      summary: List employees
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/attendance/check-in:
    post:
      summary: Record a check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Employee already checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/attendance/check-out:
    post:
      summary: Record a check-out against the open check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '201':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No open check-in found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/attendance:
    get:
      summary: Attendance history for an employee
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Defaults to 30 days ago
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Defaults to now
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Attendance logs, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/face/enroll:
    post:
      summary: Enroll (or re-enroll) an employee's face template
      description: |
        Stores the L2-normalized average of the quality-passing embeddings as
        the employee's face template, replacing any previous template.
        Embeddings are extracted on-device; supported dimensions: 128, 192, 512.
        Frames with quality_score below 0.5 are discarded; at least one frame
        must pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceEnrollRequest'
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/face/verify:
    post:
      summary: Verify a face embedding 1:1 against the claimed employee
      description: |
        Compares the probe embedding against the claimed employee's stored
        template using cosine distance. match is true when
        distance < threshold (default 0.50, tunable via FACE_MATCH_THRESHOLD).

        Anti-spoofing (Milestone 3) runs before the comparison:
        - liveness_score is required (when FACE_LIVENESS_REQUIRED=true) and
          must be >= FACE_LIVENESS_THRESHOLD (default 0.70); a lower score
          returns match=false with reject_reason=liveness_too_low and is
          logged to the spoof_attempts audit table — the embedding is not
          compared in that case.
        - After MAX_LIVENESS_FAILURES (default 5) rejected liveness checks
          within one hour, verification is locked for
          LIVENESS_LOCKOUT_MINUTES (default 15); the API answers 423 with
          retry_after in seconds.
        - An optional challenge_id from GET /api/v1/face/challenge is
          validated single-use (replay protection).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          description: Face verification temporarily locked after repeated failed liveness checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      locked:
                        type: boolean
                        example: true
                      retry_after:
                        type: integer
                        description: Seconds until the lock lifts
                        example: 840
                      message:
                        type: string
                        example: "face verification locked after repeated failed liveness checks; retry in 840 seconds"

  /api/v1/face/challenge:
    get:
      summary: Issue a single-use liveness challenge
      description: |
        Returns a challenge (blink or turn_head) for the mobile app to
        perform on-device. The challenge_id is sent back with the verify
        call and is validated single-use: unknown, expired (>2 minutes),
        or reused ids are rejected. Challenges are kept in memory;
        a multi-instance production deployment should use Redis instead.
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    ActiveOnly:
      name: active_only
      in: query
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: bad_request
        message:
          type: string
          example: email is not valid

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Admin
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          minLength: 8
          example: secret123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires
          example: 900

    TokenPairResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'

    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_no:
          type: string
          example: EMP001
        name:
          type: string
          example: Budi Santoso
        department:
          type: string
          example: IT
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      required: [employee_no, name]
      properties:
        employee_no:
          type: string
          example: EMP001
        name:
          type: string
          example: Budi Santoso
        department:
          type: string
          example: IT

    EmployeeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    AttendanceLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        type:
          type: string
          enum: [check_in, check_out]
        method:
          type: string
          enum: [face, manual]
          description: face is reserved for Milestone 2
        verified:
          type: boolean
        liveness_score:
          type: number
          nullable: true
          description: Reserved for Milestone 2 anti-spoofing
        recorded_at:
          type: string
          format: date-time

    CheckInRequest:
      type: object
      required: [employee_no]
      properties:
        employee_no:
          type: string
          example: EMP001
        method:
          type: string
          enum: [face, manual]
          default: manual
        device_id:
          type: string
          example: pixel-8-abc123
        platform:
          type: string
          example: android

    CheckOutRequest:
      type: object
      required: [employee_no]
      properties:
        employee_no:
          type: string
          example: EMP001
        device_id:
          type: string
        platform:
          type: string

    AttendanceLogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AttendanceLog'

    AttendanceLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceLog'

    FaceEnrollRequest:
      type: object
      required: [employee_id, embeddings, quality_scores]
      properties:
        employee_id:
          type: integer
          format: int64
          example: 1
        embeddings:
          type: array
          description: 1-5 face embeddings extracted on-device (dimensions 128, 192 or 512)
          minItems: 1
          maxItems: 5
          items:
            type: array
            items:
              type: number
              format: float
        quality_scores:
          type: array
          description: Per-frame quality 0-1, aligned with embeddings; frames below 0.5 are discarded
          items:
            type: number
            minimum: 0
            maximum: 1

    FaceVerifyRequest:
      type: object
      required: [employee_id, embedding, liveness_score]
      properties:
        employee_id:
          type: integer
          format: int64
          description: Claimed identity — verification is always 1:1, never 1:N
          example: 1
        embedding:
          type: array
          description: Probe embedding extracted on-device
          items:
            type: number
            format: float
        liveness_score:
          type: number
          minimum: 0
          maximum: 1
          description: >
            On-device liveness score, required when FACE_LIVENESS_REQUIRED=true
            (default). Rejected (match=false, logged to spoof_attempts) when
            below FACE_LIVENESS_THRESHOLD (default 0.70).
        device_id:
          type: string
          description: Optional device identifier, logged with rejected liveness checks
          example: "dev-1"
        challenge_id:
          type: string
          description: >
            Optional single-use challenge id from GET /api/v1/face/challenge.
            When supplied it must be valid (not expired, not reused).
          example: "a3f1c9..."

    FaceEnrollment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        dimension:
          type: integer
          example: 128
        quality_score:
          type: number
          example: 0.85
        enrolled_at:
          type: string
          format: date-time

    FaceEnrollmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FaceEnrollment'

    FaceVerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            match:
              type: boolean
              example: true
            distance:
              type: number
              description: Cosine distance between probe and template (0 when liveness fails — the embedding is not compared)
              example: 0.12
            threshold:
              type: number
              description: Acceptance threshold (match when distance < threshold)
              example: 0.5
            liveness:
              type: object
              description: Liveness gate outcome (present when liveness is required or a score was supplied)
              properties:
                score:
                  type: number
                  example: 0.92
                threshold:
                  type: number
                  example: 0.7
                passed:
                  type: boolean
                  example: true
            reject_reason:
              type: string
              description: Set when the attempt was rejected before embedding comparison (e.g. liveness_too_low)
              example: "liveness_too_low"

    FaceChallengeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            challenge_id:
              type: string
              description: Single-use challenge id to send back with the verify call
              example: "a3f1c9e2b4d60718293a4b5c6d7e8f90"
            type:
              type: string
              description: Liveness action the user must perform on-device
              enum: [blink, turn_head]
              example: "blink"
            expires_in:
              type: integer
              description: Seconds until the challenge expires
              example: 120
